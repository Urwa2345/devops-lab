<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DevOps Task Manager{% endblock %}</title>
  <style>
    :root {
      --bg:#0b1020; --bg2:#111936; --card:#161f3d; --card2:#1c2750; --line:#2a3766;
      --text:#e8edff; --muted:#8e9bc7; --accent:#6c8cff; --accent2:#38d6c4;
      --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0; min-height:100vh; color:var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #22306b 0%, transparent 60%),
                  radial-gradient(900px 500px at 100% 0%, #123b4a 0%, transparent 55%), var(--bg);
    }
    a { color:inherit; text-decoration:none; }

    /* top bar */
    .nav { position:sticky; top:0; z-index:10; backdrop-filter:blur(10px);
           background:rgba(11,16,32,.75); border-bottom:1px solid var(--line); }
    .nav-in { max-width:860px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px; }
    .logo { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:16px;
            background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .links { display:flex; gap:6px; }
    .links a { padding:8px 14px; border-radius:999px; color:var(--muted); font-size:.92rem; transition:.15s; }
    .links a:hover { color:var(--text); background:var(--card); }
    .links a.active { color:#fff; background:var(--card2); border:1px solid var(--line); }

    main { max-width:860px; margin:0 auto; padding:36px 20px 60px; }
    .hero h1 { margin:0 0 6px; font-size:clamp(1.8rem,4vw,2.5rem); letter-spacing:-.5px; }
    .hero p { margin:0 0 28px; color:var(--muted); }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px; }
    .chip { font-size:.78rem; padding:5px 11px; border-radius:999px; border:1px solid var(--line); color:var(--muted); background:rgba(255,255,255,.02); }

    /* stats */
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:26px; }
    .stat { background:linear-gradient(180deg,var(--card),var(--bg2)); border:1px solid var(--line); border-radius:16px; padding:18px; }
    .stat b { display:block; font-size:1.9rem; line-height:1.1; }
    .stat span { color:var(--muted); font-size:.85rem; }
    .stat.total b { color:var(--accent); } .stat.pend b { color:var(--warn); } .stat.done b { color:var(--ok); }

    /* add form */
    .add { display:flex; gap:10px; margin-bottom:18px; }
    .add input { flex:1; padding:15px 16px; border-radius:14px; border:1px solid var(--line); background:var(--card);
                 color:var(--text); font-size:1rem; outline:none; transition:.15s; }
    .add input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(108,140,255,.18); }
    .btn { padding:0 22px; border:0; border-radius:14px; font-weight:700; font-size:.98rem; cursor:pointer; color:#08101f;
           background:linear-gradient(135deg,var(--accent),var(--accent2)); transition:.15s; }
    .btn:hover { transform:translateY(-1px); filter:brightness(1.08); }

    /* filter tabs */
    .tabs { display:flex; gap:8px; margin:6px 0 14px; }
    .tab { padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted);
           cursor:pointer; font-size:.88rem; }
    .tab.on { background:var(--card2); color:#fff; }

    /* list */
    ul { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
    li.task { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
              border-radius:14px; padding:13px 14px; transition:.15s; }
    li.task:hover { border-color:#3b4b8c; transform:translateY(-1px); }
    .check { all:unset; width:24px; height:24px; border-radius:8px; border:2px solid #4a5a9c; cursor:pointer; display:grid; place-items:center; flex:none; }
    .check:hover { border-color:var(--accent2); }
    .check.on { background:var(--ok); border-color:var(--ok); color:#06281a; font-weight:900; }
    .body { flex:1; min-width:0; }
    .title { word-break:break-word; }
    .meta { display:block; color:var(--muted); font-size:.78rem; margin-top:2px; }
    li.is-done .title { text-decoration:line-through; color:var(--muted); }
    .del { all:unset; cursor:pointer; color:var(--muted); padding:6px 10px; border-radius:8px; font-size:.85rem; }
    .del:hover { color:var(--danger); background:rgba(248,113,113,.1); }
    .empty { text-align:center; color:var(--muted); padding:36px 10px; border:1px dashed var(--line); border-radius:14px; }
    form.inline { display:contents; }

    /* system page */
    .panel { background:linear-gradient(180deg,var(--card),var(--bg2)); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
    .row { display:flex; justify-content:space-between; gap:16px; padding:15px 18px; border-bottom:1px solid var(--line); }
    .row:last-child { border-bottom:0; }
    .row span:first-child { color:var(--muted); }
    .row code { color:var(--accent2); word-break:break-all; text-align:right; }
    .status { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; font-size:.85rem; margin-bottom:18px; border:1px solid var(--line); }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 10px var(--ok); }
    .dot.bad { background:var(--danger); box-shadow:0 0 10px var(--danger); }
    .note { color:var(--muted); font-size:.88rem; margin-top:16px; line-height:1.55; }

    footer { max-width:860px; margin:0 auto; padding:0 20px 40px; color:var(--muted); font-size:.85rem; text-align:center; }
    footer code { color:var(--accent2); background:rgba(56,214,196,.08); padding:2px 8px; border-radius:6px; }

    @media (max-width:560px) {
      .stats { grid-template-columns:1fr 1fr 1fr; gap:8px; } .stat { padding:12px; } .stat b { font-size:1.4rem; }
      .add { flex-direction:column; } .btn { padding:14px; }
      .links a { padding:7px 10px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-in">
      <a class="brand" href="/"><span class="logo">✓</span> TaskFlow</a>
      <div class="links">
        <a href="/" class="{{ 'active' if page == 'tasks' }}">Tasks</a>
        <a href="/system" id="nav-system" class="{{ 'active' if page == 'system' }}">System</a>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>Served by container: <code id="server-host">{{ host }}</code></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
